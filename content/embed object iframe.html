<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Embedding PDF: iframe vs embed vs object</title>
    <link rel="stylesheet" href="../style/default.css">
</head>

<body>
    <nav><a href="../index.html">about</a> | <a href="image,audio,video.html">multimedia</a> | <a
            href="canvas.html">canvas</a> | <a href="svg.html">svg</a> | <a
            href="embed object iframe.html">embed/object/iframe</a></nav>
    <hr>
    <section>
        <h2>Using &lt;iframe&gt;</h2><iframe src="FEWAD2526.pdf"></iframe>
    </section>
    <section>
        <h2>Using &lt;embed&gt;</h2><embed src="FEWAD2526.pdf" type="application/pdf" />
    </section>
    <section>
        <h2>Using &lt;object&gt;</h2><object data="FEWAD2526.pdf" type="application/pdf">
            <p>PDF could not be displayed. <a href="FEWAD2526.pdf">Download PDF</a></p>
        </object>
    </section>
</body>

</html>
